[project]
name = "takshak"
version = "2.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE"]
ignore = ["E402", "E501", "E741"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
mypy_path = "hooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
